<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A scuola in Italia</title>
<link rel="icon" href="data:,">
<style>

:root{--cream:#F7F4EE;--paper:#FFFDF8;--navy:#0E2A5B;--navy2:#1B3B73;--line:#D9D3C7;--terra:#A8461F;--terra-l:#F6E3D8;--ok:#1D6B39;--ok-l:#E3F1E7;--bad:#9A2A1C;--bad-l:#FBE8E3;--mus:#C98A12;--mus-l:#FBF0D6;}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .4em}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.2rem}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
header.top .brand{font-family:Georgia,serif;font-weight:700;font-size:1.15rem}
/* step bar */
nav.steps{display:flex;flex-wrap:wrap;gap:5px;padding:4px 2px 10px;scrollbar-width:thin}
nav.steps button{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--navy)}
nav.steps button .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cream);border:2px solid var(--navy);font-size:.8rem}
nav.steps button[aria-current="step"]{background:var(--navy);color:#fff;border-color:var(--navy)}
nav.steps button[aria-current="step"] .num{background:#fff;color:var(--navy)}
nav.steps button.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
/* card */
.card{position:relative;background:var(--paper);border:2px solid var(--navy);border-radius:20px;padding:22px 22px 22px 40px;box-shadow:6px 6px 0 var(--navy);
background-image:linear-gradient(to right,transparent 22px,#E9B9A6 22px,#E9B9A6 24px,transparent 24px);}
.card h2{display:flex;align-items:center;gap:10px}
.card h2 svg{flex:0 0 auto}
.it{font-style:normal;font-weight:700}
.sub{font-size:.95rem;color:#33476E;margin:0 0 14px}
.dir{background:var(--mus-l);border-left:5px solid var(--mus);padding:10px 14px;border-radius:10px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:var(--paper);color:var(--navy)}
.btn.ghost:hover{background:#EEE9DF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,nav.steps button:focus-visible,.sent:focus-visible,.chip:focus-visible{outline:4px solid var(--mus);outline-offset:2px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
input[type=text],input[type=url],textarea{width:100%;border:2px solid var(--navy);border-radius:12px;background:#fff;padding:10px 12px;font-size:1.05rem}
textarea{min-height:110px;resize:vertical;line-height:1.6}
label{font-weight:700}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.98rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-l);color:var(--ok);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-l);color:var(--bad);border:2px solid var(--bad)}
.fb.info{background:#E8EEF8;color:var(--navy);border:2px solid var(--navy)}
.fb b{font-weight:800}
/* accent bar */
.accents{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:.9rem}
.accents button{min-width:44px;min-height:44px;border:2px solid var(--navy);background:#fff;border-radius:10px;font-size:1.15rem;font-weight:700;cursor:pointer}
/* title */
.hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;border:2px solid var(--navy);display:block}
.plan{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.plan li{display:flex;gap:12px;align-items:center;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:2px solid var(--navy);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.tabs button .tick{margin-left:6px}
/* vocab */
.vocab{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;align-items:start}
.vocab img{width:100%;border-radius:14px;border:2px solid var(--navy);background:#fff;aspect-ratio:1/1;object-fit:cover}
.en-big{font-size:1.4rem;font-weight:800;margin:4px 0 10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);background:#fff}
.dots span.ok{background:var(--ok);border-color:var(--ok)}
.dots span.help{background:var(--mus);border-color:var(--mus)}
.dots span.cur{outline:3px solid var(--terra);outline-offset:1px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1}
/* drill rows */
.rows{display:grid;gap:12px}
.row{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.row.ok{border-color:var(--ok)}
.row .q{font-size:1.1rem;margin-bottom:6px}
.row .q .en{display:block;font-size:.9rem;color:#33476E}
.row .inrow input{max-width:260px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--navy);margin:0 4px}
/* reading */
.readgrid{display:grid;grid-template-columns:1fr;gap:16px}
.readimg{width:100%;border-radius:14px;border:2px solid var(--navy)}
.para{font-size:1.15rem;line-height:1.8;margin:0 0 14px}
.sent{display:inline;cursor:pointer;border-radius:6px;padding:1px 2px;border-bottom:2px dotted var(--terra);background:none;border-top:0;border-left:0;border-right:0;text-align:left;font-size:inherit;line-height:inherit}
.sent:hover{background:var(--terra-l)}
.sent.open{background:var(--terra-l)}
.tr{display:block;margin:4px 0 10px;padding:6px 12px;border-left:5px solid var(--terra);background:#fff;font-size:1rem;font-style:italic;color:#24375C}
.gloss{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.gloss span{border:2px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff;font-size:.92rem}
/* compare & research */
.qcard{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:14px}
.starter{font-size:.95rem;color:#33476E;margin:4px 0 8px}
.chip{border:2px solid var(--navy);background:var(--cream);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:40px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.topic{border:2px solid var(--navy);background:#fff;border-radius:14px;padding:12px;cursor:pointer;text-align:left;min-height:48px}
.topic[aria-pressed="true"]{background:var(--navy);color:#fff}
.topic .t{font-weight:800;font-size:1.05rem;display:block}
.topic .d{font-size:.9rem;display:block;margin-top:2px}
.srcs a{color:var(--navy);font-weight:700;word-break:break-word}
.srcs li{margin:4px 0}
/* essay */
.essaygrid{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.essaygrid textarea{min-height:300px;background:#fff repeating-linear-gradient(to bottom,#fff 0,#fff 29px,#DCE3EE 30px);line-height:30px;padding-top:0;background-attachment:local}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-size:.95rem}
.check li.met{border-color:var(--ok);background:var(--ok-l)}
.check .box{flex:0 0 26px;height:26px;border-radius:7px;border:2px solid var(--navy);display:grid;place-items:center;background:#fff}
.check li.met .box{background:var(--ok);border-color:var(--ok)}
.check .found{display:block;font-size:.82rem;color:#33476E}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
/* summary */
.sum h3{margin-top:18px;border-bottom:2px solid var(--line);padding-bottom:4px}
.sum p{white-space:pre-wrap;margin:6px 0}
.sum .empty{color:var(--bad);font-style:italic}
.score{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.score span{border:2px solid var(--navy);border-radius:12px;padding:6px 12px;background:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;display:none;z-index:9}
.toast.show{display:block}
.sr{position:absolute;left:-9999px}
@media (max-width:700px){
 html{font-size:18px}
 .card{padding:16px 14px 18px 26px;box-shadow:4px 4px 0 var(--navy);background-image:linear-gradient(to right,transparent 12px,#E9B9A6 12px,#E9B9A6 14px,transparent 14px)}
 .vocab{grid-template-columns:1fr}
 .vocab img{max-width:190px;margin:0 auto;display:block}
 .essaygrid{grid-template-columns:1fr}
 h1{font-size:1.6rem}h2{font-size:1.35rem}
 .row .inrow input{max-width:none}
 nav.steps{flex-wrap:nowrap;overflow-x:auto}
 nav.steps button .lbl{display:none}
 nav.steps button{padding:5px}
 nav.steps button[aria-current="step"] .lbl{display:inline}
 nav.steps button[aria-current="step"]{padding-right:12px}
}
#printout{display:none}
@media print{
 body{background:#fff}
 .wrap,.toast{display:none!important}
 #printout{display:block;color:#000;font-size:12pt;padding:0 10px}
 #printout h1{font-size:18pt}
 #printout h3{font-size:13pt;margin:14px 0 4px;border-bottom:1px solid #999}
 #printout p{white-space:pre-wrap;margin:4px 0}
}
.cando{list-style:none;padding:0;margin:10px 0 16px;display:grid;gap:8px}
.cando li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.cando li svg{flex:0 0 auto;margin-top:2px}
table.plan{width:100%;border-collapse:collapse;margin:8px 0 14px;background:#fff;font-size:.95rem}
table.plan th,table.plan td{border:2px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.plan th{background:#E8EEF8}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800;border:2px solid var(--navy)}
.tag.home{background:var(--mus-l);border-color:var(--mus);color:#5A3D00}
.tag.cls{background:#E8EEF8}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{border:2px solid var(--navy);border-radius:14px;background:#fff;padding:8px;text-align:center}
.gcard img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.gcard .itw{font-weight:800;font-size:1.05rem;margin-top:6px}
.gcard .enw{font-size:.88rem;color:#33476E}
.ptitle{font-family:Georgia,serif;font-size:1.15rem;margin:18px 0 4px}
.lockmsg{font-size:.9rem;color:#5A3D00;background:var(--mus-l);border:2px solid var(--mus);border-radius:10px;padding:6px 10px;margin:6px 0 10px}
.vf{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.vf button{min-width:110px}
.vf button[aria-pressed="true"]{outline:4px solid var(--mus)}
.org{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.org .col{border:2px solid var(--navy);border-radius:14px;padding:12px;background:#fff}
.org .col h3{margin:0 0 6px}
.org textarea{min-height:64px;margin-bottom:8px}
details.box{border:2px solid var(--navy);border-radius:14px;background:#fff;padding:10px 14px;margin:0 0 14px}
details.box summary{cursor:pointer;font-weight:800;min-height:32px}
.model{font-size:1.05rem;line-height:1.8}
.model b{color:var(--ok)}
.model u{text-decoration-color:var(--terra);text-decoration-thickness:3px}
table.rub{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
table.rub th,table.rub td{border:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.rub th{background:#E8EEF8}
.note{font-size:.92rem;background:#E8EEF8;border-left:5px solid var(--navy);padding:8px 12px;border-radius:10px;margin:0 0 14px}
.selfchk label{font-weight:600;display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.selfchk input{width:22px;height:22px;flex:0 0 22px;margin-top:3px}
.three{display:grid;gap:8px}
@media (max-width:700px){.org{grid-template-columns:1fr}table.rub{font-size:.8rem}table.plan{font-size:.85rem}}

</style>
</head>

 $("#usenotes",m).onclick=function(){var notes=S.sim.concat(S.dif).map(function(x){x=x.trim();return x&&!/[.!?]$/.test(x)?x+".":x;}).filter(Boolean);if(!notes.length){toast("Write your notes in Step 5 first.");return;}var v=ta.value.trim();ta.value=(v?v+" ":"")+notes.join(" ")+" ";S.essay=ta.value;save();upd();renderSteps();ta.focus();};
 $all("[data-wst]",m).forEach(function(b){b.onclick=function(){var s=STARTERS[+b.getAttribute("data-wst")];var v=ta.value;if(v&&!/\s$/.test(v))v+=" ";ta.value=v+s+" ";S.essay=ta.value;save();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);upd();};});
 $all("[data-self]",m).forEach(function(c){c.onchange=function(){S.self[c.getAttribute("data-self")]=c.checked;save();};});};
function vfScore(){return VF.filter(function(_,i){var x=S.vf[i];return x&&x.st==="ok";}).length;}
function summaryText(name){
 var t=TOPICS.filter(function(x){return x.id===S.topic;})[0],L=[],f=0;BL.forEach(function(_,j){var s=S.d["bl"+j];if(s&&s.st==="ok")f++;});
 L.push("A scuola in Italia (Italian 2)");if(name)L.push("Name: "+name);L.push("");
 L.push("CAPITO? (Understand)");L.push("True/false: "+vfScore()+" of "+VF.length+" right on the first try");VF.forEach(function(it,i){var x=S.vf[i]||{};if(!it.ans)L.push("Fixed sentence "+(i+1)+": "+((x.cval||"").trim()||"(not done)"));});SA.forEach(function(it,i){var x=S.sa[i]||{};L.push(it.q+" "+((x.val||"").trim()||"(not done)"));});L.push("Completa: "+f+" of "+BL.length+" right without help");L.push("");
 L.push("CONFRONTA (Compare)");L.push("Same:");S.sim.forEach(function(x,i){L.push("  "+(i+1)+". "+(x.trim()||"(not done)"));});L.push("Different:");S.dif.forEach(function(x,i){L.push("  "+(i+1)+". "+(x.trim()||"(not done)"));});L.push("Why? "+(S.persp.trim()||"(not done)"));if(S.partner.trim())L.push("My partner says: "+S.partner.trim());L.push("");
 L.push("RICERCA (Research)");L.push("Topic: "+(t?t.t:"(not chosen)"));S.facts.forEach(function(x,i){L.push("Fact "+(i+1)+": "+(x.trim()||"(not done)"));});S.its.forEach(function(x,i){L.push("Italian "+(i+1)+": "+(x.trim()||"(not done)"));});L.push("Comparison: "+(S.cmp.trim()||"(not done)"));L.push("Source: "+(S.srcname.trim()||"(no name)")+" "+(S.url.trim()||"(no link)"));L.push("");
 L.push("SCRIVI (Write): La mia scuola e la scuola italiana");L.push(S.essay.trim()||"(not done)");L.push("");
 L.push("MY GOALS (I can...)");CANDO.forEach(function(c,i){L.push((S.can[i]?"[x] ":"[ ] ")+c);});
 return L.join("\n");}
R.done=function(){
 var missing=[1,3,4,5,6,7].filter(function(i){return !stepDone(i);}).map(function(i){return STEPS[i].lbl;});
 var f=0;BL.forEach(function(_,j){var s=S.d["bl"+j];if(s&&s.st==="ok")f++;});
 return head(8)+'<div class="dir">Check your goals, then tap <b>Copy all</b> and paste your work into Google Classroom, or tap <b>Print</b>.</div>'+
 (missing.length?'<div class="fb show info">Still to finish: <b lang="it">'+missing.join(", ")+'</b>. Tap a step at the top to go back.</div>':'<div class="fb show ok"><b>Great work!</b> Every step is done.</div>')+
 '<div class="score"><span>Words: '+countDone("v",VOCAB.length)+'/'+VOCAB.length+'</span><span>essere &amp; avere: '+countDone("ea",EA.length)+'/'+EA.length+'</span><span>-are verbs: '+countDone("ar",AREV.length)+'/'+AREV.length+'</span><span>True/false: '+vfScore()+'/'+VF.length+'</span><span>Completa: '+f+'/'+BL.length+'</span></div>'+
 '<div class="qcard selfchk"><b>My goals. Check the ones you can do now:</b>'+CANDO.map(function(c,i){return '<label><input type="checkbox" data-can="'+i+'"'+(S.can[i]?" checked":"")+'> '+esc(c)+'</label>';}).join("")+'</div>'+
 '<label for="sname">Your name (only used for Copy and Print, not saved):</label><input id="sname" type="text" autocomplete="off" style="max-width:420px">'+
 '<div class="navrow"><button class="btn" id="copyall" type="button">'+svg("copy",22,"#fff")+' Copy all</button><button class="btn ghost" id="printit" type="button">'+svg("print",22)+' Print</button></div>'+
 '<div class="sum" id="sumview"></div>'+
 '<div class="navrow" style="margin-top:26px"><button class="btn ghost" type="button" id="resetall">Start over (erase my work)</button></div>';};
W.done=function(m){
 var nm=$("#sname",m);
 function fill(){var txt=summaryText(nm.value.trim());var lines=txt.split("\n").slice(1);var html=lines.map(function(l){return /^(CAPITO|CONFRONTA|RICERCA|SCRIVI|MY GOALS)/.test(l)?"<h3>"+esc(l)+"</h3>":(l?"<p>"+esc(l)+"</p>":"");}).join("");$("#printout").innerHTML="<h1>A scuola in Italia (Italian 2)</h1>"+html;$("#sumview",m).innerHTML=html;return txt;}
 fill();nm.addEventListener("input",fill);
 $all("[data-can]",m).forEach(function(c){c.onchange=function(){S.can[c.getAttribute("data-can")]=c.checked;save();fill();};});
 $("#copyall",m).onclick=function(){var txt=fill();
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);toast(ok?"Copied. Now paste it into Google Classroom.":"Copy did not work. Select the text and copy it by hand.");}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){toast("Copied. Now paste it into Google Classroom.");},fallback);}else fallback();};
 $("#printit",m).onclick=function(){fill();window.print();};
 $("#resetall",m).onclick=function(){if(confirm("Erase all your answers on this device and start over?")){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};};
render();
})();
